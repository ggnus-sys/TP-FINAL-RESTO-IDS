{% extends 'base.html' %}

{% block title %}Kaifer &mdash; Registrarse{% endblock %}

{% block header_banner %}
<div id="fh5co-header" class="fh5co-cover js-fullheight" style="background-image: url({{ url_for('static', filename='images/cafe_portada_2.jpeg') }});" data-stellar-background-ratio="0.5">
	<div class="overlay"></div>
	<div class="container">
		<div class="row">
			<div class="col-md-12 text-center">
				<div class="display-t js-fullheight">
					<div class="display-tc js-fullheight animate-box" data-animate-effect="fadeIn">
						<h1>Creá tu <em>cuenta</em></h1>
						<h2>Unite a Kaiser</h2>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block content %}

<div class="fh5co-section">
	<div class="container">
		<div class="row">
			<div class="col-md-4 col-md-offset-4 col-sm-6 col-sm-offset-3">
				<div class="fh5co-heading text-center">
					<h2>Register</h2>
				</div>
				<form action="{{ url_for('auth.register') }}" method="POST">
					<div class="row form-group">
						<div class="col-md-6">
							<label for="nombre">Nombre</label>
							<input type="text" class="form-control" id="nombre" name="nombre" placeholder="Juan" required>
						</div>
						<div class="col-md-6">
							<label for="apellido">Apellido</label>
							<input type="text" class="form-control" id="apellido" name="apellido" placeholder="García" required>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<label for="email">Email</label>
							<input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<label for="password">Contraseña</label>
							<input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<label for="confirmar_password">Confirmar contraseña</label>
							<input type="password" class="form-control" id="confirmar_password" name="confirmar_password" placeholder="••••••••" required>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<button type="submit" class="btn btn-primary btn-outline btn-lg btn-block">Crear cuenta</button>
						</div>
					</div>
					<p class="text-center" style="margin-top:15px;">
						¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a>
					</p>
				</form>
			</div>
		</div>
	</div>
</div>

{% endblock %}
