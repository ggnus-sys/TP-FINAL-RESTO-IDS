<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <menut name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Codes</title>
  </head>
  <body>
    <h1>QR de confirmación de tu reserva</h1>
    <p>Hola {{ usuario.nombre }}!</p>
    <p>Tu reserva ha sido confirmada. Para acceder a tu reserva, escanea el siguiente código QR:</p>
    <div style="text-align: center;">
        <img src="cid:image1" alt="QR Code" />
    </div>
    <p style="text-align: center;">
      <a href="{{ link_confirmar }}" style="display:inline-block; padding:10px 24px; background:#1d9e75; color:#fff; text-decoration:none; border-radius:6px; margin-right:8px;">
        Confirmar reserva
      </a>
      <a href="{{ link_cancelar }}" style="display:inline-block; padding:10px 24px; background:#c0392b; color:#fff; text-decoration:none; border-radius:6px;">
        Cancelar reserva
      </a>
    </p>
    <p>Este código QR es válido hasta {{ expira_en }}.</p>
  </body>
</html>
