{% extends 'base.html' %}

{% block title %}Confirmar Reserva - Kaifer{% endblock %}

{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='style/cancel_reservation.css') }}">{% endblock %}

{% block content %}
<section class="cancel-page">
    <h2>¿Confirmar la reserva #{{ id_reserva }}?</h2>
    <p>Al confirmar, tu reserva quedará activa.</p>

    <div class="cancel-page__actions">
        <form action="{{ url_for('reservas_bp.confirmacion_reserva') }}?reserva_id={{ id_reserva }}" method="post">
            <button type="submit" class="btn btn-primary">Sí, confirmar reserva</button>
        </form>
        <a href="{{ url_for('reservas_bp.reservas') }}" class="btn btn-outline">Volver</a>
    </div>
</section>
{% endblock %}
