{% extends 'base.html' %}

{% block title %}Kaifer &mdash; Editar Plato{% endblock %}

{% block header_banner %}
<div id="fh5co-header" class="fh5co-cover js-fullheight" style="background-image: url({{ url_for('static', filename='images/cafe_portada_3.jpeg') }});" data-stellar-background-ratio="0.5">
	<div class="overlay"></div>
	<div class="container">
		<div class="row">
			<div class="col-md-12 text-center">
				<div class="display-t js-fullheight">
					<div class="display-tc js-fullheight animate-box" data-animate-effect="fadeIn">
						<h1>Editar <em>Plato</em></h1>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block content %}

<div class="fh5co-section">
	<div class="container">
		<div class="row">
			<div class="col-md-12 fh5co-heading animate-box">
				<h2>Editar Servicio</h2>
			</div>
			<div class="col-md-8">
				<form action="{{ url_for('servicios-extra.editar_servicio_extra', servicio_extra_id=servicio.id) }}" method="post" enctype="multipart/form-data">
					<div class="row form-group">
						<div class="col-md-12">
							<label>Nombre del servicio</label>
							<input type="text" name="nombre_servicio" class="form-control" value="{{ servicio.nombre_servicio }}" required>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<label>Descripción</label>
							<input type="text" name="descripcion" class="form-control" value="{{ servicio.descripcion }}">
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<label>Imagen de representación(png o jpeg)</label>
							<input type="file" name="service_image" class="form-control" accept="image/png, image/jpeg"/>
						</div>
					</div>
					<div class="row form-group">
						<div class="col-md-12">
							<button type="submit" class="btn btn-primary btn-outline btn-lg">Guardar Cambios</button>
							<a href="{{ url_for('admin') }}" class="btn btn-default btn-lg">Cancelar</a>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

{% endblock %}
